group = "com.lightsoftware.flutter_background_video_recorder"
version = "2.1.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.lightsoftware.flutter_background_video_recorder.plugin"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 31
        // Rules apps pick up when they shrink their release build.
        consumerProguardFiles "consumer-rules.pro"
    }

    // The native library that moves camera frames to Dart through shared memory.
    externalNativeBuild {
        cmake {
            path = "src/main/cpp/CMakeLists.txt"
        }
    }

    testOptions {
        unitTests.all {
            // A build of the native library for this machine (scripts/test_native.sh --jni), so the
            // JNI layer can be tested on the JVM. The tests that need it are skipped without it.
            def hostLib = System.getenv("FBVR_HOST_LIB")
            if (hostLib != null) systemProperty "fbvr.host.lib", hostLib
        }
    }

    dependencies {
        implementation("androidx.core:core-ktx:1.15.0")
        testImplementation("junit:junit:4.13.2")
    }
}
